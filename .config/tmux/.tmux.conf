if "test ! -d $HOME/.tmux/plugins/tpm" "run 'git clone https://github.com/tmux-plugins/tpm $HOME/.tmux/plugins/tpm && $HOME/.tmux/plugins/tpm/bin/install_plugins'"
# =============================
# ======General Settings ======
# =============================
# Faster command sequences
set-option -sg escape-time 10
# Enable RGB colour if running in xterm(1)
set -as terminal-features ',*-256color:RGB'
# Colored undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
# start windows numbering at 1
# Start index of window/pane with 1, because we're humans, not computers
setw -g pane-base-index 1
set -g base-index 1
# No bells at all
set -g bell-action none
# Keep windows around after they exit
# set -g remain-on-exit off
# Boost history
set -g history-limit 50000
# Turn the mouse on, but without copy mode dragging
set -g mouse on
# Rename window to reflect current program
setw -g automatic-rename on
# setw -g allow-rename off
# Renumber windows when a window is closed
set -g renumber-windows on

# No bells at all
set -g bell-action none
set -g default-terminal "screen-256color"
# set -g buffer-limit 20
# set -g display-time 1500
# set -g remain-on-exit off
# set -g repeat-time 300
# setw -g aggressive-resize on

# Change the prefix key to C-a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Set parent terminal title to reflect current window in tmux session
set -g set-titles on
set -g set-titles-string "#I:#W"
#List of plugins
# List of plugins
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'seebi/tmux-colors-solarized'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'olimorris/tmux-pomodoro-plus'

set -g @plugin 'tmux-plugins/tpm'

# plugin configs
# set -g status-right '#{cpu_bg_color} CPU: #{cpu_icon} #{cpu_percentage} | %a %h-%d %H:%M '
# set -g status-right '#{cpu_bg_color} CPU: #{cpu_icon} #{cpu_percentage} | %H:%M '
# set -g @resurrect-strategy-nvim 'session'
set -g @batt_icon_charge_tier8 '🌕'
set -g @batt_icon_charge_tier7 '🌖'
set -g @batt_icon_charge_tier6 '🌖'
set -g @batt_icon_charge_tier5 '🌗'
set -g @batt_icon_charge_tier4 '🌗'
set -g @batt_icon_charge_tier3 '🌘'
set -g @batt_icon_charge_tier2 '🌘'
set -g @batt_icon_charge_tier1 '🌑'
set -g @batt_icon_status_charged '🔋'
set -g @batt_icon_status_charging '⚡'
set -g @batt_icon_status_discharging '👎'
set -g @batt_color_status_primary_charged '#3daee9'
set -g @batt_color_status_primary_charging '#3daee9'
# set -g status-right 'Colors: #{battery_color_bg}bg#[default] #{battery_color_fg}fg#[default] #{battery_color_charge_bg}charge_bg#[default] #{battery_color_charge_fg}charge_fg#[default] #{battery_color_status_bg}status_bg#[default] #{battery_color_status_fg}status_fg#[default] | Graph: #{battery_graph} | Icon: #{battery_icon} | Charge Icon: #{battery_icon_charge} | Status Icon: #{battery_icon_status} | Percent: #{battery_percentage} | Remain: #{battery_remain}'
set -g status-right-length '150'
set -g status-right 'CP: #{cpu_percentage} BP: #{battery_percentage} | %H:%M '
# <prefix> + ctrl s保存sessionenv,<prefix> + ctrl r加载sessionenv
# set -g @continuum-save-interval '5'
set -g @yank_selection 'clipboard' # or 'secondary' or 'primary'
set -g @yank_action 'copy-pipe' # or 'copy-pipe-and-cancel' for the default
# set -g @tmux-gruvbox 'dark' # or 'light'
# commands
# C-a [ 之后可以使用jhkl等去滚动tmux面板，q退出滚动模式
set-option -g default-command "/usr/local/bin/fish -l"

# install tmux plugin manager
#    Add new plugin to ~/.tmux.conf with set -g @plugin '...'
#    Press prefix + I (capital i, as in Install) to fetch the plugin.

#base configs
#set -g mouse on
# set -g @shell_mode 'vi'
setw -g mode-keys vi
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R


# Resize pane shortcuts
bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10

# Reload configuration
bind r source-file ~/.tmux.conf \; display "~/.tmux.conf sourced"

# Kill pane/window/session shortcuts
bind x kill-pane
bind X kill-window
bind C-x confirm-before -p "kill other windows? (y/n)" "kill-window -a"
bind Q confirm-before -p "kill-session #S? (y/n)" kill-session


set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

set -g @pomodoro_notifications 'on'
# set -g @catppuccin_flavor 'mocha'

set -g @catppuccin_cpu_text " #{l:#{cpu_percentage}} #{l:#{ram_icon}} #{l:#{ram_percentage}}"
set -g @catppuccin_window_current_text "#W"

set -g status-right-length 100

set -g @catppuccin_pomodoro_plus_icon " "
set -g @catppuccin_date_time_text " %H:%M"

set -g status-left ""
set -gF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -agF status-right "#{E:@catppuccin_status_pomodoro_plus}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -ag status-right "#{E:@catppuccin_status_host}"
# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

run $HOME/.tmux/plugins/tmux-cpu/cpu.tmux
run $HOME/.tmux/plugins/tmux-battery/battery.tmux
# Load catppuccin
# For TPM, instead use `run ~/.tmux/plugins/tmux/catppuccin.tmux`
run $HOME/.tmux/plugins/tmux/catppuccin.tmux
# Or, if using TPM, just run TPM


run -b "$HOME/.tmux/plugins/tpm/tpm"
