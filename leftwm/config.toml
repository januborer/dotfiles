# y = 390
# height = 300
# width = 200

#######Keybind########
###Execute

[[keybind]]
command = "Execute"
value = "brightnessctl set 5%-"
modifier = []
key = "XF86MonBrightnessDown"

[[keybind]]
command = "Execute"
value = "brightnessctl set +5%"
modifier = []
key = "XF86MonBrightnessUp"

[[keybind]]
command = "Execute"
value = "pactl set-sink-volume @DEFAULT_SINK@ +5%"
modifier = []
key = "XF86AudioRaiseVolume"

[[keybind]]
command = "Execute"
value = "pactl set-sink-volume @DEFAULT_SINK@ -5%"
modifier = []
key = "XF86AudioLowerVolume"

[[keybind]]
command = "Execute"
value = "pactl set-sink-mute @DEFAULT_SINK@ toggle"
modifier = []
key = "XF86AudioMute"

[[keybind]]
command = "Execute"
value = "pactl set-source-mute @DEFAULT_SOURCE@ toggle"
modifier = []
key = "XF86AudioMicMute"

[[keybind]]
command = "Execute"
value = "playerctl play-pause"
modifier = []
key = "XF86AudioPlay"

[[keybind]]
command = "Execute"
value = "playerctl next"
modifier = []
key = "XF86AudioNext"

[[keybind]]
command = "Execute"
value = "playerctl previous"
modifier = []
key = "XF86AudioPrev"

[[keybind]]
command = "Execute"
value = "dmenu_run"
modifier = []
key = "XF86Search"

[[keybind]]
command = "Execute"
value = "netease-cloud-music"
modifier = []
key = "XF86Search"

[[keybind]]
command = "Execute"
value = "grim $HOME/screenshots/$(date +'%s_grim.png')"
modifier = []
key = "Print"

