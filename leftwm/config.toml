modkey = "Mod1"
mousekey = "Mod1"
# workspaces = [{x=0,y=0,width=3840,height=2160}]
# workspaces = [{x=0,y=0,width=,height=2160}]
workspaces = []
tags = ["Clutter", "Conscious", "Thinking", "CS", "Rust", "Enjoy", "Communicate", "Eight", "Company"]
layouts = ["MainAndVertStack", "MainAndHorizontalStack", "MainAndDeck", "GridHorizontal", "EvenHorizontal", "EvenVertical", "Fibonacci", "LeftMain", "CenterMain", "CenterMainBalanced", "CenterMainFluid", "Monocle", "RightWiderLeftStack", "LeftWiderRightStack"]
# Tag,Workspace
layout_mode = "Workspace"
insert_behavior = "Bottom"
scratchpad = [
    { name = "Htop", value = "htop", x = 860, y = 390, height = 300, width = 200 },
]
window_rules = []
disable_current_tag_swap = true
disable_tile_drag = false
# Sloppy,ClickTo,Driven
focus_behaviour = "Sloppy"
focus_new_windows = true
# max_window_width = 0.9

